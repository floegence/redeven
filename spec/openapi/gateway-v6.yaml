{
  "openapi": "3.1.0",
  "info": {
    "title": "Redeven Gateway device admission and Runtime attachments",
    "version": "redeven-gateway-v6",
    "description": "Gateway provides independent client-device admission, Runtime attachments, reverse application streams and optional restricted network egress. One public HTTPS endpoint composes client access and authenticated Runtime attachment transport. Administration uses a private Unix socket and host credential; loopback TCP and headers alone never prove host authority. Runtime initiates attachments; Gateway never dials Runtime application URLs or manages Runtime lifecycle. Runtime owns application TLS, authentication and Cloud association. Limits are 1,024 attachments, 32 business streams per attachment and 1,024 globally, including pending opens and network egress."
  },
