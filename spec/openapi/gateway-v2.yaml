          $ref: '#/components/schemas/ProtocolVersion'
        authorization_permit:
          type: string
          writeOnly: true
    RuntimeArtifactMetadata:
      type: object
      required: [size_bytes, sha256, manifest]
      additionalProperties: false
      properties:
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
        manifest:
          description: Signed compatibility and capability manifest JSON.
        manifest_signature:
          type: string
        manifest_certificate:
          type: string
        build_attestation:
          description: Custom-build attestation JSON bound to the prepared build inputs.
    RuntimeOperationPrepareEnvelope:
      type: object
      required: [ok, data]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/RuntimeOperationPrepareResponse'
    RuntimeOperationEnvelope:
      type: object
      required: [ok, data]
      additionalProperties: false
      properties:
        ok:
          type: boolean
