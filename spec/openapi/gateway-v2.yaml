        observed_at_unix_ms:
          type: integer
          format: int64
    WorkloadImpact:
      type: object
      required: [knowledge, protected_workload_present]
      additionalProperties: false
      properties:
        knowledge:
          type: string
          enum: [known, unknown]
        affected_process_count:
          type: integer
          minimum: 0
        active_session_count:
          type: integer
          minimum: 0
        protected_workload_present:
          type: boolean
    RuntimeArtifact:
      type: object
      required: [size_bytes, sha256, manifest_sha256, policy]
      additionalProperties: false
      properties:
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
        manifest_sha256:
          type: string
        policy:
          $ref: '#/components/schemas/ArtifactPolicy'
    RuntimeCommitCheckpoint:
