        - timestamp_unix_ms
      additionalProperties: false
      properties:
        sequence:
          type: integer
          format: int64
        operation_id:
          type: string
        lifecycle_target_id:
          type: string
        target_generation:
          type: integer
          format: int64
        operation:
          $ref: '#/components/schemas/RuntimeOperationKind'
        state:
          $ref: '#/components/schemas/RuntimeOperationState'
        reason_code:
          type: string
        timestamp_unix_ms:
          type: integer
          format: int64
