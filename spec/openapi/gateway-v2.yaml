      enum: [allowed, denied, unknown]
    DesiredRuntime:
      type: object
      required: [version, platform, architecture, artifact_policy]
      additionalProperties: false
      properties:
        version:
          type: string
        platform:
          type: string
        architecture:
          type: string
        artifact_policy:
          $ref: '#/components/schemas/ArtifactPolicy'
    RuntimeOperationActor:
      type: object
      required: [kind, subject_id]
      additionalProperties: false
      properties:
        kind:
          type: string
        subject_id:
          type: string
    RuntimeOperationAuthorization:
      type: object
      required: [decision, linearized, grants, scope_digest, authorized_at_unix_ms]
      additionalProperties: false
      properties:
        decision:
