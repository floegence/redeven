          $ref: '#/components/schemas/ProtocolVersion'
        operation_id:
          type: string
        idempotency_key:
          type: string
        lifecycle_target_id:
          type: string
        target_generation:
          type: integer
          format: int64
        gateway_env_id:
          type: string
        kind:
          $ref: '#/components/schemas/RuntimeOperationKind'
        requested_actor:
          $ref: '#/components/schemas/RuntimeOperationActor'
        route_binding_id:
          type: string
        authorized_client_key_id:
          type: string
        desired_runtime:
          $ref: '#/components/schemas/DesiredRuntime'
        build_inputs:
          description: Canonical JSON build inputs.
        prepare_scope_digest:
          type: string
        state:
          $ref: '#/components/schemas/RuntimeOperationState'
        expires_at_unix_ms:
          type: integer
          format: int64
        maximum_expires_at_unix_ms:
