      enum: [manage_runtime, deploy_custom_runtime, manage_runtime_binding]
    CapabilitySupport:
      type: string
      enum: [supported, unsupported, unknown]
    ManagementReadiness:
      type: string
      enum: [ready, setup_required, temporarily_unavailable, unknown]
    ManagementPresentationState:
