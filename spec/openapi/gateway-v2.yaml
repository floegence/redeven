        - kind
        - requested_actor
        - authorized_client_key_id
        - desired_runtime
        - prepare_scope_digest
        - state
        - expected_snapshot
        - authorization
        - created_at_unix_ms
        - updated_at_unix_ms
      additionalProperties: false
