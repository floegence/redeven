        protocol_version:
          $ref: '#/components/schemas/ProtocolVersion'
        snapshot_revision:
          type: integer
          format: int64
          minimum: 0
        process_inventory_digest:
          type: string
        workload_identity_digest:
          type: string
        risk_summary_digest:
          type: string
    RuntimeOperationRenewRequest:
      type: object
      required: [protocol_version, expires_at_unix_ms]
      additionalProperties: false
      properties:
        protocol_version:
          $ref: '#/components/schemas/ProtocolVersion'
        expires_at_unix_ms:
