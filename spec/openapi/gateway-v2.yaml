        scope_digest:
          type: string
        authorized_at_unix_ms:
          type: integer
          format: int64
    WorkloadSnapshot:
      type: object
      required:
        - snapshot_revision
        - process_inventory_digest
        - workload_identity_digest
        - workload
        - observed_at_unix_ms
      additionalProperties: false
      properties:
        runtime_binary_version:
          type: string
        snapshot_revision:
          type: integer
          format: int64
        process_inventory_digest:
          type: string
        workload_identity_digest:
          type: string
        workload_identities:
          type: array
          uniqueItems: true
          items:
            type: string
        workload:
