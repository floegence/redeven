openapi: 3.1.0
x-redeven-contract-scope:
  includes: Signed /gateway/v3 JSON endpoints and session-scoped HTTP, WebSocket, and byte-stream access.
  excludes:
    - Desktop bridge Local UI routes such as /, /_redeven_proxy/*, /_redeven_direct/*, and /api/local/*.
    - Desktop bridge stdio frame and hello protocol schemas.
x-redeven-signature-payload:
  algorithm: ed25519
  canonicalization: canonical JSON with lexicographically sorted object keys
  fields:
    - protocol_version
    - method
    - route
    - body_digest
    - gateway_id
    - binding_audience
    - nonce
    - timestamp_unix_ms
info:
  title: Redeven Gateway Protocol
  version: redeven-gateway-v3
  summary: Gateway HTTP API for pairing, catalog, environment sessions, and access profile management.
servers:
  - url: https://gateway.example
    description: Paired Gateway URL transport.
  - url: http://redeven-gateway.local
    description: HTTP request stream carried by the Desktop bridge gateway_protocol surface.
tags:
  - name: Pairing
  - name: Catalog
  - name: Session
  - name: Profiles
paths:
  /gateway/v3/pairing/challenge:
    post:
      tags: [Pairing]
      operationId: createGatewayPairingChallenge
      summary: Create a signed Gateway pairing challenge.
      description: URL transports require the configured pairing code. Desktop bridge transports are authorized by the bridge token injected below the bridge layer.
      parameters:
        - $ref: '#/components/parameters/GatewayTransportHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingChallengeRequest'
      responses:
        '200':
          description: Signed Gateway pairing challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingChallengeEnvelope'
        default:
          $ref: '#/components/responses/GatewayError'
  /gateway/v3/pairing/complete:
    post:
      tags: [Pairing]
      operationId: completeGatewayPairing
      summary: Complete pairing after the client verifies the challenge.
      description: Profile-write pairing requires explicit env_profile_write consent and the Gateway enable-profile-write policy on either supported transport.
      parameters:
        - $ref: '#/components/parameters/GatewayTransportHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingCompleteRequest'
      responses:
        '200':
          description: Signed Gateway pairing completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCompleteEnvelope'
        default:
          $ref: '#/components/responses/GatewayError'
  /gateway/v3/catalog:
    post:
      tags: [Catalog]
      operationId: listGatewayEnvironments
      summary: List Gateway metadata and visible environments.
      security:
        - GatewayID: []
          GatewayBindingAudience: []
          GatewayClientKeyID: []
          GatewayClientNonce: []
          GatewayRequestTimestamp: []
          GatewayRequestSignature: []
      parameters:
        - $ref: '#/components/parameters/GatewayTransportHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRequest'
      responses:
        '200':
          description: Gateway catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        default:
          $ref: '#/components/responses/GatewayError'
  /gateway/v3/open-session:
    post:
      tags: [Session]
      operationId: openGatewayEnvironmentSession
      summary: Mint a short-lived artifact for opening a Gateway environment.
      security:
        - GatewayID: []
          GatewayBindingAudience: []
          GatewayClientKeyID: []
          GatewayClientNonce: []
          GatewayRequestTimestamp: []
          GatewayRequestSignature: []
      parameters:
        - $ref: '#/components/parameters/GatewayTransportHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenSessionRequest'
      responses:
        '200':
          description: Gateway open-session artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenSessionEnvelope'
        default:
          $ref: '#/components/responses/GatewayError'
  /gateway/v3/close-session:
    post:
      tags: [Session]
      operationId: closeGatewayEnvironmentSession
      summary: Idempotently revoke a proxy session owned by the authenticated client.
      security:
        - GatewayID: []
          GatewayBindingAudience: []
          GatewayClientKeyID: []
          GatewayClientNonce: []
          GatewayRequestTimestamp: []
          GatewayRequestSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseSessionRequest'
      responses:
        '200':
          description: Session revocation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseSessionEnvelope'
        default:
          $ref: '#/components/responses/GatewayError'
  /gateway/v3/access/{token}/{path}:
    parameters:
      - name: token
        in: path
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      - name: path
        in: path
        required: true
        schema: {type: string}
        description: Remaining Runtime root-relative path, including an empty root. The service also accepts POST, PUT, PATCH, DELETE, HEAD, OPTIONS, and WebSocket upgrades.
    x-redeven-catch-all: true
    get:
      tags: [Session]
      operationId: accessGatewayEnvironment
      summary: Proxy an HTTP request through the Gateway fixed listener.
      description: Token is a short-lived bearer secret. HTTP access uses a per-session Gateway Cookie jar, strips Set-Cookie and internal proxy headers, rejects cross-origin redirects, and streams without buffering. Runtime login remains mandatory. Never log the token or full access URL.
      responses:
        '200': {description: Streaming Runtime response.}
        '101': {description: Runtime WebSocket upgrade.}
        '401': {description: Gateway session expired or missing; Runtime may independently return its authentication response. X-Redeven-Gateway-Error distinguishes Gateway failures.}
        '502': {description: Gateway target unavailable.}
  /gateway/v3/access/{token}/_tunnel:
    parameters:
      - name: token
        in: path
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    get:
      tags: [Session]
      operationId: tunnelGatewayEnvironment
      summary: Open a target-bound WebSocket byte stream for Desktop.
      description: Only the stored profile host and port can be dialed. Desktop preserves Runtime origin and HTTPS end-to-end through an authenticated loopback HTTP or CONNECT proxy. Runtime cookies stay in the isolated Desktop partition on this path. Client binary messages are consumed incrementally without a request-size limit tied to message framing; Gateway output is chunked into at most 32 KiB messages. Messages form one continuous byte stream. Revocation uses WebSocket close code 4001. Normal upstream EOF ends the stream; no address-selection or Runtime-management command is accepted.
      responses:
        '101': {description: Binary byte stream opened.}
        '401': {description: Gateway session expired or revoked.}
        '502': {description: Gateway target unavailable.}
  /gateway/v3/env-profiles/upsert:
    post:
      tags: [Profiles]
      operationId: upsertGatewayEnvironmentProfile
      summary: Create or update a Gateway-owned environment profile.
      description: Requires a paired client with env_profile_write and the Gateway enable-profile-write policy, independently of URL or Desktop bridge transport.
      security:
        - GatewayID: []
          GatewayBindingAudience: []
          GatewayClientKeyID: []
          GatewayClientNonce: []
          GatewayRequestTimestamp: []
          GatewayRequestSignature: []
          GatewayManagedBridgeToken: []
      parameters:
        - $ref: '#/components/parameters/GatewayTransportHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvProfileUpsertRequest'
      responses:
        '200':
          description: Saved Gateway environment profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvProfileUpsertEnvelope'
        default:
          $ref: '#/components/responses/GatewayError'
  /gateway/v3/env-profiles/delete:
    post:
      tags: [Profiles]
      operationId: deleteGatewayEnvironmentProfile
      summary: Delete a Gateway-owned environment profile.
      description: Requires a paired client with env_profile_write and the Gateway enable-profile-write policy on either supported transport.
      security:
        - GatewayID: []
          GatewayBindingAudience: []
          GatewayClientKeyID: []
          GatewayClientNonce: []
          GatewayRequestTimestamp: []
          GatewayRequestSignature: []
          GatewayManagedBridgeToken: []
      parameters:
        - $ref: '#/components/parameters/GatewayTransportHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvProfileDeleteRequest'
      responses:
        '200':
          description: Profile deletion result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvProfileDeleteEnvelope'
        default:
          $ref: '#/components/responses/GatewayError'
components:
  securitySchemes:
    GatewayID:
      type: apiKey
      in: header
      name: X-Redeven-Gateway-ID
    GatewayBindingAudience:
      type: apiKey
      in: header
      name: X-Redeven-Gateway-Binding-Audience
    GatewayClientKeyID:
      type: apiKey
      in: header
      name: X-Redeven-Client-Key-ID
    GatewayClientNonce:
      type: apiKey
      in: header
      name: X-Redeven-Client-Nonce
    GatewayRequestTimestamp:
      type: apiKey
      in: header
      name: X-Redeven-Request-TS
    GatewayRequestSignature:
      type: apiKey
      in: header
      name: X-Redeven-Request-Signature
    GatewayManagedBridgeToken:
      type: apiKey
      in: header
      name: X-Redeven-Gateway-Managed-Bridge-Token
  responses:
    GatewayError:
      description: Gateway error envelope.
      x-redeven-http-statuses: [400, 401, 403, 404, 423, 500, 501]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayErrorEnvelope'
  parameters:
    GatewayTransportHeader:
      name: X-Redeven-Gateway-Transport
      in: header
      required: false
      description: Set to desktop_bridge by the Desktop bridge transport when routing Gateway HTTP over a bridge stream.
      schema:
        type: string
        enum: [desktop_bridge]

  schemas:
    ProtocolVersion:
      type: string
      const: redeven-gateway-v3
    GatewayErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - UNAUTHORIZED
        - TRUST_CHANGED
        - NOT_FOUND
        - CAPABILITY_UNSUPPORTED
        - UNAVAILABLE
        - NOT_IMPLEMENTED
    GatewayErrorShape:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/GatewayErrorCode'
        message:
          type: string
        retryable:
          type: boolean
        redacted_detail:
          type: string
    GatewayErrorEnvelope:
      type: object
      required: [ok, error]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/GatewayErrorShape'
    CatalogRequest:
      type: object
      required: [protocol_version]
      additionalProperties: false
      properties:
        protocol_version:
          $ref: '#/components/schemas/ProtocolVersion'
    CatalogEnvelope:
      type: object
      required: [ok, data]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CatalogResponse'
    CatalogResponse:
      type: object
      required: [protocol_version, gateway, environments]
      additionalProperties: false
      properties:
        protocol_version:
          $ref: '#/components/schemas/ProtocolVersion'
        gateway:
          $ref: '#/components/schemas/GatewayMetadata'
        environments:
          type: array
          items:
            $ref: '#/components/schemas/Environment'
    GatewayMetadata:
      type: object
      required: [gateway_id, display_name, status, capabilities]
      additionalProperties: false
      properties:
        gateway_id:
          type: string
        display_name:
          type: string
        status:
          $ref: '#/components/schemas/GatewayStatus'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/GatewayCapability'
          uniqueItems: true
        gateway_public_key_fingerprint:
          type: string
    GatewayStatus:
      type: string
      enum:
        - online
        - pairing_required
        - trust_changed
        - error
        - unknown
    GatewayCapability:
      type: string
      enum:
        - env_catalog
        - env_direct_open
        - env_proxy_open
        - env_profile_write
        - terminal
        - files
        - web_service
        - port_forward
    Environment:
      type: object
      required:
        - gateway_env_id
        - display_name
        - env_kind
        - state
        - capabilities
        - access_capabilities
        - origin
      additionalProperties: false
      properties:
        gateway_env_id:
          type: string
        display_name:
          type: string
        env_kind:
          $ref: '#/components/schemas/EnvironmentKind'
        state:
          $ref: '#/components/schemas/EnvironmentState'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentCapability'
          uniqueItems: true
        access_capabilities:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentCapability'
          uniqueItems: true

        profile:
          $ref: '#/components/schemas/EnvironmentProfile'
        profile_access_route:
          $ref: '#/components/schemas/EnvProfileAccessRoute'
        access_endpoint:
          description: Immutable access-only endpoint for opening the Environment. This is never a Gateway API or bridge URL.
          $ref: '#/components/schemas/EnvProfileAccessRoute'

        origin:
          $ref: '#/components/schemas/EnvironmentOrigin'
        last_seen_at_unix_ms:
          type: integer
          format: int64
          minimum: 1
    EnvironmentKind:
      type: string
      enum:
        - managed_local_env
        - reachable_env
    EnvironmentState:
      type: string
      enum:
        - unknown
        - available
        - starting
        - stopped
        - archived
    EnvironmentCapability:
      type: string
      enum:
        - open
        - open_direct
        - open_via_gateway
        - terminal
        - files
        - web_service
        - port_forward
    EnvironmentProfile:
      type: object
      required: [managed, access_route_kind, access_mode]
      additionalProperties: false
      properties:
        managed:
          type: boolean
          const: true
        access_route_kind:
          $ref: '#/components/schemas/EnvProfileAccessRouteKind'
        access_mode:
          $ref: '#/components/schemas/AccessMode'
    EnvironmentOrigin:
      type: object
      required: [kind, label]
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/EnvironmentOriginKind'
        label:
          type: string
    EnvironmentOriginKind:
      type: string
      enum:
        - gateway_host
        - ssh_target
        - container
        - network_target
    PairingChallengeRequest:
      type: object
      required:
        - protocol_version
        - client_nonce
        - client_public_key
        - binding_audience
      additionalProperties: false
      properties:
        protocol_version:
          $ref: '#/components/schemas/ProtocolVersion'
        client_nonce:
          type: string
        client_public_key:
          type: string
        binding_audience:
          type: string
        pairing_code:
          type: string
    PairingChallengeEnvelope:
      type: object
      required: [ok, data]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/PairingChallengeResponse'
    PairingChallengeResponse:
      type: object
      required:
        - protocol_version
        - gateway_id
        - gateway_public_key
        - gateway_public_key_fingerprint
        - gateway_nonce
        - expires_at_unix_ms
        - signature
      additionalProperties: false
      properties:
        protocol_version:
          $ref: '#/components/schemas/ProtocolVersion'
        gateway_id:
          type: string
        gateway_public_key:
          type: string
        gateway_public_key_fingerprint:
          type: string
        gateway_nonce:
          type: string
        pairing_code:
          type: string
        expires_at_unix_ms:
          type: integer
          format: int64
        signature:
          type: string
    PairingCompleteRequest:
      type: object
      required:
        - protocol_version
        - client_nonce
        - gateway_nonce
        - gateway_id
        - binding_audience
        - client_key_id
        - proof
      additionalProperties: false
      properties:
        protocol_version:
          $ref: '#/components/schemas/ProtocolVersion'
        client_nonce:
          type: string
        gateway_nonce:
          type: string
        gateway_id:
          type: string
        binding_audience:
          type: string
        client_key_id:
          type: string
        client_capability:
          type: string
          enum: [env_profile_write]
        proof:
          type: string
    PairingCompleteEnvelope:
      type: object
      required: [ok, data]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/PairingCompleteResponse'
    PairingCompleteResponse:
      type: object
      required:
        - protocol_version
        - gateway_id
        - client_key_id
        - paired_at_unix_ms
        - proof
      additionalProperties: false
      properties:
        protocol_version:
          $ref: '#/components/schemas/ProtocolVersion'
        gateway_id:
          type: string
        client_key_id:
          type: string
        paired_at_unix_ms:
          type: integer
          format: int64
        proof:
          type: string
    OpenSessionRequest:
      type: object
      required:
        - protocol_version
        - gateway_env_id
        - requested_capability
        - client_nonce
      additionalProperties: false
      properties:
        protocol_version:
          $ref: '#/components/schemas/ProtocolVersion'
        gateway_env_id:
          type: string
        access_mode:
          $ref: '#/components/schemas/AccessMode'
        requested_capability:
          $ref: '#/components/schemas/RequestedCapability'
        client_nonce:
          type: string
        bridge_session_id:
          type: string
        route_id:
          type: string
    AccessMode:
      type: string
      enum: [direct_url, gateway_proxy]
      description: Explicit access route. Existing v1 profiles migrate to direct_url; new URL profiles default to gateway_proxy. No automatic fallback. SSH profile kinds cannot select gateway_proxy.
    CloseSessionRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, gateway_session_id]
      properties:
        protocol_version:
          $ref: '#/components/schemas/ProtocolVersion'
        gateway_session_id:
          type: string
    CloseSessionEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          additionalProperties: false
          required: [protocol_version, gateway_session_id, closed]
          properties:
            protocol_version:
              $ref: '#/components/schemas/ProtocolVersion'
            gateway_session_id:
              type: string
            closed:
              type: boolean
              description: True when an owned live proxy session was revoked; repeated, missing, or other-client sessions return false without disclosing ownership.
    GatewayProxyConnectArtifact:
      type: object
      additionalProperties: false
      required: [kind, url, gateway_session_id, expires_at_unix_ms, artifact_nonce, proof]
      properties:
        kind:
          const: gateway_proxy_artifact
        url:
          type: string
          format: uri
          description: Fixed Gateway origin and access prefix with a 256-bit opaque token; secret and main-process-only.
        gateway_session_id:
          type: string
        expires_at_unix_ms:
          type: integer
          format: int64
        artifact_nonce:
          type: string
        proof:
          type: string
    RequestedCapability:
      type: string
      enum:
        - env_app
        - terminal
        - files
        - web_service
        - port_forward
    OpenSessionEnvelope:
      type: object
      required: [ok, data]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/OpenSessionResponse'
    OpenSessionResponse:
      type: object
      required:
        - protocol_version
        - gateway_session_id
        - gateway_env_id
        - connect_artifact
      additionalProperties: false
      properties:
        protocol_version:
          $ref: '#/components/schemas/ProtocolVersion'
        gateway_session_id:
          type: string
        gateway_env_id:
          type: string
        connect_artifact:
          $ref: '#/components/schemas/GatewayConnectArtifact'
        diagnostics_hint:
          $ref: '#/components/schemas/DiagnosticsHint'
    GatewayConnectArtifact:
      oneOf:
        - $ref: '#/components/schemas/LocalDirectConnectArtifact'
        - $ref: '#/components/schemas/GatewayProxyConnectArtifact'
        - $ref: '#/components/schemas/DesktopBridgeConnectArtifact'
    LocalDirectConnectArtifact:
      type: object
      required:
        - kind
        - url
        - expires_at_unix_ms
        - artifact_nonce
        - proof
      additionalProperties: false
      properties:
        kind:
          type: string
          const: local_direct_artifact
        url:
          type: string
          format: uri
        expires_at_unix_ms:
          type: integer
          format: int64
        artifact_nonce:
          type: string
        proof:
          type: string
    DesktopBridgeConnectArtifact:
      type: object
      required:
        - kind
        - url
        - gateway_session_id
        - bridge_session_id
        - route_id
        - expires_at_unix_ms
        - artifact_nonce
        - proof
      additionalProperties: false
      properties:
        url:
          type: string
          pattern: '^/gateway/v3/access/[A-Za-z0-9_-]{43}/$'
          description: Session access path resolved only through the bound Desktop bridge gateway_protocol surface.
        gateway_session_id:
          type: string
        kind:
          type: string
          const: desktop_bridge_artifact
        bridge_session_id:
          type: string
        route_id:
          type: string
        expires_at_unix_ms:
          type: integer
          format: int64
        artifact_nonce:
          type: string
        proof:
          type: string
    DiagnosticsHint:
      type: object
      required: [gateway_env_id, connection_kind]
      additionalProperties: false
      properties:
        gateway_env_id:
          type: string
        connection_kind:
          type: string
    EnvProfileUpsertRequest:
      type: object
      required: [protocol_version, profile]
      additionalProperties: false
      properties:
        protocol_version:
          $ref: '#/components/schemas/ProtocolVersion'
        profile:
          $ref: '#/components/schemas/EnvProfileInput'
    EnvProfileInput:
      type: object
      required: [display_name, access_route]
      additionalProperties: false
      properties:
        gateway_env_id:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$'
        display_name:
          type: string
        access_mode:
          $ref: '#/components/schemas/AccessMode'
        access_route:
          $ref: '#/components/schemas/EnvProfileAccessRoute'
    EnvProfileAccessRoute:
      oneOf:
        - $ref: '#/components/schemas/EnvProfileURLAccessRoute'
        - $ref: '#/components/schemas/EnvProfileSSHHostAccessRoute'
        - $ref: '#/components/schemas/EnvProfileSSHContainerAccessRoute'
      discriminator:
        propertyName: kind
    EnvProfileURLAccessRoute:
      type: object
      required: [kind, url]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: url
        url:
          type: string
          format: uri
          description: Absolute http or https URL. Embedded credentials are rejected by Gateway profile validation.
        origin_label:
          type: string
    EnvProfileSSHHostAccessRoute:
      type: object
      required: [kind, ssh_destination]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: ssh_host
        origin_label:
          type: string
        ssh_destination:
          type: string
        ssh_port:
          type: integer
          description: Omit or send 0 to use the default SSH port.
          minimum: 0
          maximum: 65535
        auth_mode:
          type: string
          description: SSH authentication mode used by this Gateway connection.
          enum:
            - key_agent
        ssh_password_configured:
          type: boolean
          readOnly: true
        ssh_runtime_root:
          type: string
    EnvProfileSSHContainerAccessRoute:
      type: object
      required: [kind, ssh_destination, container_engine, container_id, container_runtime_root]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: ssh_container
        origin_label:
          type: string
        ssh_destination:
          type: string
        ssh_port:
          type: integer
          description: Omit or send 0 to use the default SSH port.
          minimum: 0
          maximum: 65535
        auth_mode:
          type: string
          description: SSH authentication mode used by this Gateway connection.
          enum:
            - key_agent
        ssh_password_configured:
          type: boolean
          readOnly: true
        ssh_runtime_root:
          type: string
        container_engine:
          type: string
          enum:
            - docker
            - podman
        container_id:
          type: string
        container_runtime_root:
          type: string
    EnvProfileAccessRouteKind:
      type: string
      enum:
        - url
        - ssh_host
        - ssh_container
