    RuntimeControlArtifactPoolV2:
      type: object
      additionalProperties: false
      required:
      - version
      - logical_cloud_binding_id
      - binding_generation
      - target_waterline
      - refresh_horizon_seconds
      - server_highest_artifact_sequence
      - entries
      - response_digest_b64u
      properties:
        version:
          type: string
          const: control_artifact_pool_v2
        logical_cloud_binding_id:
          type: string
          minLength: 1
        binding_generation:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
        target_waterline:
          type: integer
          const: 2
        refresh_horizon_seconds:
          type: integer
          const: 60
        server_highest_artifact_sequence:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
          description: Authenticated durable server high-watermark after this exact
            delivery. Top-up entries are internally contiguous but may start after
            an expired, undelivered sequence range.
        entries:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/RuntimeControlArtifactPoolEntry'
        response_digest_b64u:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: For bootstrap, SHA-256 of the canonical pool JSON with this
            field empty. For top-up, SHA-256 of the canonical outer response with
            this field empty, including top_up_request_id_b64u.
    RuntimeControlArtifactPoolTopUpRequest:
      type: object
      additionalProperties: false
      required:
      - env_public_id
      - local_environment_public_id
      - binding_generation
      - top_up_request_id_b64u
      properties:
        env_public_id:
          type: string
          minLength: 1
        local_environment_public_id:
          type: string
          minLength: 1
        binding_generation:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
        top_up_request_id_b64u:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Canonical base64url encoding of a fresh 32-byte idempotency
            ID persisted before RPC type 41006. Existing IDs are replayed before capacity
            enforcement; a new ID after 65,536 accepted bootstrap and top-up delivery
            IDs in the exact binding generation receives 409/control_pool_relink_required
            and requires relinking.
    RuntimeControlArtifactPoolTopUpResponse:
      type: object
      additionalProperties: false
      required:
      - top_up_request_id_b64u
      - pool
      properties:
        top_up_request_id_b64u:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Exact ID echoed from the persisted pending request and covered
            by response_digest_b64u.
        pool:
          allOf:
          - $ref: '#/components/schemas/RuntimeControlArtifactPoolV2'
          - type: object
            properties:
              entries:
                type: array
                maxItems: 4
                items:
                  $ref: '#/components/schemas/RuntimeControlArtifactPoolEntry'
      description: Flowersec RPC type 41006 response; exact serialized JSON is limited
        to 524,288 bytes. The same request ID replays the same outbox bytes until
        its replay horizon. Entries are internally contiguous, but their first sequence
        may be above the Runtime's local high-watermark when an older undelivered
        outbox expired; server_highest_artifact_sequence authenticates that forward
        gap.
    RuntimeControlArtifactPoolAck:
      type: object
      additionalProperties: false
      required:
      - env_public_id
      - binding_generation
      - top_up_request_id_b64u
      - response_digest_b64u
      - highest_artifact_sequence
      properties:
        env_public_id:
          type: string
          minLength: 1
        binding_generation:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
        top_up_request_id_b64u:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        response_digest_b64u:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        highest_artifact_sequence:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
    RuntimeControlArtifactPoolAckResponse:
      type: object
      additionalProperties: false
      required:
      - ok
      properties:
        ok:
          type: boolean
          const: true
      description: Exact Flowersec RPC type 41007 response. Repeating an ACK for the
        same outbox is idempotent; an expired tombstone returns top_up_request_expired
        and never issues replacement artifacts for that ID.
    RuntimeControlArtifactPoolEntry:
      type: object
      additionalProperties: false
      required:
      - artifact_json
      - artifact_channel_id
      - binding_generation
      - artifact_sequence
      - expires_at_unix_s
      properties:
        artifact_json:
          type: object
          description: Opaque Flowersec 5 artifact JSON; its exact serialized form
            is limited to 65,536 bytes and consumers must pass it only to the published
            SDK parser.
        artifact_channel_id:
          type: string
          minLength: 1
        binding_generation:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
        artifact_sequence:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
        expires_at_unix_s:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
