openapi: 3.1.0
info:
  title: Redeven Cloud Protocol
  version: rcpp-v5
  summary: Cloud authority and assigned Access Point contract for Redeven clients.
servers:
- url: https://redeven.com
  description: Redeven Cloud authority
tags:
- name: CloudAuthority
- name: AccessPoint
- name: MobileOAuth
- name: RuntimeCloud
- name: GatewayCloud
paths:
  /api/rcpp/v5/environments/{envId}/native/connect:
    post:
      tags:
      - AccessPoint
      operationId: connectNativeEnvironment
      security:
      - bearerAuth: []
      parameters:
      - name: envId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - protocol_version
              - env_public_id
              properties:
                protocol_version:
                  const: rcpp-v5
                env_public_id:
                  type: string
      responses:
        '200':
          description: Authorized single-use native environment lease; see the RCPP
            native connection specification.
          content:
            application/json:
              schema:
                type: object
                required:
                - protocol_version
                - env_public_id
                - access_point_id
                - access_point_origin
                - access
                - connection
                properties:
                  protocol_version:
                    const: rcpp-v5
                  env_public_id:
                    type: string
                  access_point_id:
                    type: string
                  access_point_origin:
                    type: string
                    format: uri
                  access:
                    $ref: '#/components/schemas/CloudEnvironmentAccess'
                  connection:
                    type: object
                    required:
                    - v
                    - connect_artifact
                    - critical_scope_projection_json
                    - spend_scope
                    properties:
                      v:
                        const: 1
                      connect_artifact:
                        type: string
                      critical_scope_projection_json:
                        type: string
                      spend_scope:
                        type: object
  /api/rcpp/v5/native/artifact/spend:
    post:
      tags:
      - AccessPoint
      operationId: spendNativeEnvironmentArtifact
      description: Receipt Bearer authorization and exact Access Point Origin are
        required; uses the shared v1 spend CAS contract.
      security:
      - bearerAuth: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          format: uri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - v
              - attempt_id
              - artifact_digest_b64u
              - projection_digest_b64u
              - runtime_origin
              - app_origin
              - consumer
              - target_binding
              - expires_at
              properties:
                v:
                  const: 1
                attempt_id:
                  type: string
                artifact_digest_b64u:
                  type: string
                projection_digest_b64u:
                  type: string
                runtime_origin:
                  type: string
                  format: uri
                app_origin:
                  type: string
                  format: uri
                consumer:
                  const: trusted
                target_binding:
                  type: object
                  additionalProperties: false
                  required:
                  - v
                  - kind
                  - env_public_id
                  - floe_app
                  - launcher_kind
                  - launcher_id
                  properties:
                    v:
                      const: 1
                    kind:
                      const: env
                    env_public_id:
                      type: string
                    floe_app:
                      const: com.floegence.redeven.agent
                    launcher_kind:
                      const: env
                    launcher_id:
                      type: string
                expires_at:
                  type: string
                  format: date-time
      responses:
        '204':
          description: Single-use receipt committed; no credentials returned.
  /.well-known/redeven-cloud.json:
    get:
      tags:
      - CloudAuthority
      operationId: getProviderDiscovery
      responses:
        '200':
          description: Cloud discovery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryResponse'
  /api/rcpp/v5/desktop/authorize:
    post:
      tags:
      - CloudAuthority
      operationId: createDesktopAuthorizationCode
      description: Called from the same-origin /desktop/connect bridge with a signed-in
        browser session. Native clients must use the authorization-code exchange;
        a Desktop bearer token cannot replace browser sign-in.
      security:
      - browserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesktopAuthorizationRequest'
      responses:
        '200':
          description: Authorization code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesktopAuthorizationResponse'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/rcpp/v5/mobile/oauth/config:
    get:
      tags:
      - MobileOAuth
      operationId: getMobileOAuthConfig
      responses:
        '200':
          description: Public provider login capabilities for native iOS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileOAuthConfigEnvelope'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/rcpp/v5/mobile/oauth/sessions:
    post:
      tags:
      - MobileOAuth
      operationId: createMobileOAuthSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMobileOAuthSessionRequest'
      responses:
        '200':
          description: Native provider authorization URL and opaque mobile state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMobileOAuthSessionEnvelope'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/rcpp/v5/mobile/oauth/exchange:
    post:
      tags:
      - MobileOAuth
      operationId: exchangeMobileOAuthCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeMobileOAuthCredentialRequest'
      responses:
        '200':
          description: Provider authorization material for native iOS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeMobileOAuthCredentialEnvelope'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/rcpp/v5/mobile/token/refresh:
    post:
      tags:
      - MobileOAuth
      operationId: refreshMobileAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudTokenRefreshRequest'
      responses:
        '200':
          description: Refreshed mobile access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTokenRefreshResponse'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/rcpp/v5/mobile/token/revoke:
    post:
      tags:
      - MobileOAuth
      operationId: revokeMobileAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudTokenRevokeRequest'
      responses:
        '204':
          description: Mobile authorization revoked.
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/rcpp/v5/desktop/connect/exchange:
    post:
      tags:
      - CloudAuthority
      operationId: exchangeDesktopAuthorizationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesktopConnectExchangeRequest'
      responses:
        '200':
          description: Desktop authorization material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesktopConnectExchangeResponse'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/rcpp/v5/desktop/token/refresh:
    post:
      tags:
      - CloudAuthority
      operationId: refreshDesktopAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudTokenRefreshRequest'
      responses:
        '200':
          description: Refreshed desktop access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTokenRefreshResponse'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/rcpp/v5/desktop/token/revoke:
    post:
      tags:
      - CloudAuthority
      operationId: revokeDesktopAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudTokenRevokeRequest'
      responses:
        '204':
          description: Authorization revoked.
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/rcpp/v5/me:
    get:
      tags:
      - CloudAuthority
      operationId: getProviderAccount
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Provider account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudMeResponse'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/rcpp/v5/environments:
    servers:
    - url: '{access_point_origin}'
      description: Use the access_point_origin returned by Cloud discovery or Runtime-link
        resolution.
      variables:
        access_point_origin:
          default: https://sg.redeven.example
          description: The exact HTTPS origin assigned to this environment.
    get:
      tags:
      - AccessPoint
      operationId: listCloudEnvironments
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Environments visible at this access point.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudEnvironmentListResponse'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/rcpp/v5/environments/runtime-health/query:
    servers:
    - url: '{access_point_origin}'
      description: Use the access_point_origin returned by Cloud discovery or Runtime-link
        resolution.
      variables:
        access_point_origin:
          default: https://sg.redeven.example
          description: The exact HTTPS origin assigned to this environment.
    post:
      tags:
      - AccessPoint
      operationId: queryCloudEnvironmentRuntimeHealth
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudEnvironmentRuntimeHealthQueryRequest'
      responses:
        '200':
          description: Runtime health snapshots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudEnvironmentRuntimeHealthQueryResponse'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/rcpp/v5/environments/{envId}/desktop/open-session:
    servers:
    - url: '{access_point_origin}'
      description: Use the access_point_origin returned by Cloud discovery or Runtime-link
        resolution.
      variables:
        access_point_origin:
          default: https://sg.redeven.example
          description: The exact HTTPS origin assigned to this environment.
    post:
      tags:
      - AccessPoint
      operationId: createDesktopOpenSession
      security:
      - bearerAuth: []
      parameters:
      - name: envId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Desktop open-session materials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesktopOpenSessionResponse'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/rcpp/v5/environments/{envId}/runtime-link/authorizations:
    servers:
    - url: '{access_point_origin}'
      description: Use the access_point_origin returned by Cloud discovery or Runtime-link
        resolution.
      variables:
        access_point_origin:
          default: https://sg.redeven.example
          description: The exact HTTPS origin assigned to this environment.
    post:
      tags:
      - AccessPoint
      operationId: createRuntimeLinkAuthorization
      security:
      - bearerAuth: []
      parameters:
      - name: envId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeLinkAuthorizationRequest'
      responses:
        '200':
          description: Short-lived Runtime-link ticket bound to the user, provider,
            access point, and Environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeLinkAuthorizationResponse'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/rcpp/v5/runtime-link/resolve:
    post:
      tags:
      - CloudAuthority
      operationId: resolveRuntimeLinkAccessPoint
      description: Validate the link ticket and return its authoritative assignment
        without consuming it. Credentials never follow cross-origin redirects.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeLinkResolveRequest'
      responses:
        '200':
          description: 'Assigned Access Point. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeLinkResolveResponse'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/console/v1/runtime-cloud/v5/challenges:
    post:
      tags:
      - RuntimeCloud
      operationId: runtimeCloudChallenges
      security: []
      description: Independent Runtime machine proof. Console selects the authoritative
        Cell and Region; redirects and client-selected credential targets are forbidden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCloudChallengeRequest'
      responses:
        '200':
          description: 'Exact approval or credential result. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - success
                - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/RuntimeCloudChallengeResponse'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/console/v1/runtime-cloud/v5/enroll:
    post:
      tags:
      - RuntimeCloud
      operationId: runtimeCloudEnroll
      security: []
      description: Independent Runtime machine proof. Console selects the authoritative
        Cell and Region; redirects and client-selected credential targets are forbidden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCloudSignedRequest'
      responses:
        '200':
          description: 'Exact approval or credential result. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - success
                - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/RuntimeCloudRecoverResponse'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/console/v1/runtime-cloud/v5/recover:
    post:
      tags:
      - RuntimeCloud
      operationId: runtimeCloudRecover
      security: []
      description: Independent Runtime machine proof. Console selects the authoritative
        Cell and Region; redirects and client-selected credential targets are forbidden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCloudSignedRequest'
      responses:
        '200':
          description: 'Exact approval or credential result. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - success
                - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/RuntimeCloudRecoverResponse'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/console/v1/runtime-cloud/v5/closure-ack:
    post:
      tags:
      - RuntimeCloud
      operationId: runtimeCloudClosureAck
      security: []
      description: Independent Runtime machine proof. Console selects the authoritative
        Cell and Region; redirects and client-selected credential targets are forbidden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCloudSignedRequest'
      responses:
        '200':
          description: 'Exact approval or credential result. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - success
                - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/RuntimeCloudClosure'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/console/v1/namespaces/{namespaceId}/runtime-cloud-bindings/by-environment/{envId}:
    get:
      tags:
      - RuntimeCloud
      operationId: runtimeCloudBindingByEnvironment
      security:
      - bearerAuth: []
      description: Current independently authorized binding. Gateway directory and
        selected network route do not grant access. Personal bindings require the
        owner actor.
      parameters:
      - name: namespaceId
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Binding metadata, or null when not enrolled.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/RuntimeCloudBindingLookup'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
  /api/console/v1/gateway-cloud/v3/notifications:
    post:
      tags:
      - GatewayCloud
      operationId: gatewayManagementNotifications
      security: []
      description: One machine-signed HTTPS stream. Initial snapshot, monotonic sequence,
        bounded consumers, 15-second transport keepalive and 60-second version calibration.
        It grants no Runtime Cloud authorization. No transaction is held while waiting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayCloudSignedRequest'
      responses:
        '200':
          description: 'Newline-delimited JSON; each line is a Notification. Cache-Control:
            no-store and X-Accel-Buffering: no. Slow consumers or identity expiry
            close the stream; reconnect obtains a new snapshot.'
          content:
            application/x-ndjson:
              schema:
                type: string
              x-record-schema:
                $ref: '#/components/schemas/GatewayCloudNotification'
        default:
          $ref: '#/components/responses/ErrorEnvelope'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: redeven-session-id
      description: Signed-in Redeven Cloud browser session, established by the normal
        browser sign-in flow.
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    RuntimeLinkConflict:
      description: Runtime-link delivery or binding conflict. An expired delivery
        is terminal for that delivery ID; the caller must request a fresh ticket and
        rotate the ID.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - success
            - error
            properties:
              success:
                type: boolean
                const: false
              error:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - RUNTIME_LINK_DELIVERY_EXPIRED
                    - RUNTIME_LINK_BINDING_STALE
                    - CONTROL_POOL_RELINK_REQUIRED
                    - ENVIRONMENT_BINDING_OCCUPIED
                  message:
                    type: string
    ErrorEnvelope:
      description: Standard error envelope.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                const: false
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
  schemas:
    DiscoveryResponse:
      type: object
      required:
      - protocol_version
      - cloud_id
      - display_name
      - cloud_origin
      - documentation_url
      - access_points
      properties:
        protocol_version:
          type: string
          const: rcpp-v5
        cloud_id:
          type: string
        display_name:
          type: string
        cloud_origin:
          type: string
          format: uri
        documentation_url:
          type: string
        access_points:
          type: array
          items:
            $ref: '#/components/schemas/CloudAccessPoint'
    CloudAccessPoint:
      type: object
      required:
      - access_point_id
      - region
      - display_name
      - access_point_origin
      - status
      properties:
        access_point_id:
          type: string
        region:
          type: string
        display_name:
          type: string
        description:
          type: string
        access_point_origin:
          type: string
          format: uri
        country_code:
          type: string
        city:
          type: string
        status:
          type: string
        health_status:
          type: string
    DesktopAuthorizationRequest:
      type: object
      required:
      - code_challenge
      - code_challenge_method
      properties:
        code_challenge:
          type: string
        code_challenge_method:
          type: string
          const: S256
    DesktopAuthorizationResponse:
      type: object
      required:
      - authorization_code
      - expires_at_unix_ms
      properties:
        authorization_code:
          type: string
        expires_at_unix_ms:
          type: integer
          format: int64
    MobileOAuthConfigResponse:
      type: object
      required:
      - cloud_origin
      - oauth_providers
      properties:
        cloud_origin:
          type: string
          format: uri
        oauth_providers:
          type: array
          items:
            $ref: '#/components/schemas/MobileOAuthSummary'
    MobileOAuthConfigEnvelope:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/MobileOAuthConfigResponse'
    MobileOAuthSummary:
      type: object
      required:
      - oauth_provider
      - display_name
      - scopes
      - code_challenge_methods_supported
      - redirect_uri
      properties:
        oauth_provider:
          type: string
          enum:
          - apple
          - google
          - github
        display_name:
          type: string
        scopes:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        redirect_uri:
          type: string
          pattern: ^(|com\.floegence\.redeven:/oauth/(google|github))$
          description: Empty for Apple native Sign in with Apple; provider callback
            URI for Google and GitHub.
          example: com.floegence.redeven:/oauth/google
    CreateMobileOAuthSessionRequest:
      type: object
      required:
      - oauth_provider
      - cloud_origin
      - client_state
      - code_challenge
      - code_challenge_method
      - redirect_uri
      - app_instance_id
      properties:
        oauth_provider:
          type: string
          enum:
          - apple
          - google
          - github
        cloud_origin:
          type: string
          format: uri
        client_state:
          type: string
          minLength: 1
          maxLength: 256
        code_challenge:
          type: string
          minLength: 43
          maxLength: 128
        code_challenge_method:
          type: string
          const: S256
        redirect_uri:
          type: string
          pattern: ^(|com\.floegence\.redeven:/oauth/(google|github))$
          description: Empty for Apple native Sign in with Apple; provider callback
            URI for Google and GitHub.
          example: com.floegence.redeven:/oauth/google
        app_instance_id:
          type: string
          minLength: 1
          maxLength: 128
    CreateMobileOAuthSessionResponse:
      type: object
      required:
      - oauth_provider
      - cloud_origin
      - authorization_url
      - mobile_oauth_state
      - expires_at_unix_ms
      properties:
        oauth_provider:
          type: string
          enum:
          - apple
          - google
          - github
        cloud_origin:
          type: string
          format: uri
        authorization_url:
          type: string
          description: Empty for Apple native Sign in with Apple; absolute provider
            authorization URL for Google and GitHub.
        mobile_oauth_state:
          type: string
          description: Opaque one-time mobile provider state handle.
        expires_at_unix_ms:
          type: integer
          format: int64
    CreateMobileOAuthSessionEnvelope:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CreateMobileOAuthSessionResponse'
    ExchangeMobileOAuthCredentialRequest:
      oneOf:
      - $ref: '#/components/schemas/ExchangeAppleMobileOAuthCredentialRequest'
      - $ref: '#/components/schemas/ExchangeGoogleMobileOAuthCredentialRequest'
      - $ref: '#/components/schemas/ExchangeGitHubMobileOAuthCredentialRequest'
    ExchangeMobileOAuthCredentialBase:
      type: object
      required:
      - oauth_provider
      - cloud_origin
      - code_verifier
      - redirect_uri
      - mobile_oauth_state
      - client_state
      - app_instance_id
      properties:
        cloud_origin:
          type: string
          format: uri
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
        mobile_oauth_state:
          type: string
          minLength: 1
