{
  "openapi": "3.1.0",
  "info": {
    "title": "Redeven Gateway membership and access",
    "version": "redeven-gateway-v5",
    "description": "Runtime is the active member initiator. Gateway never dials Runtime URLs. The administration listener rejects browser Origin headers. Runtime membership uses a separately authenticated HTTPS listener; inner Runtime TLS and Flowersec application authorization remain end to end. Member limits are 1,024 members, 32 business streams per member and 1,024 business streams globally, including pending opens and Cloud egress. No Runtime lifecycle or legacy HTTP proxy routes are exposed."
  },
