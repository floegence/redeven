            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/IdentityRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success. Responses use Cache-Control: no-store.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "ok",
                    "data"
                  ],
                  "properties": {
                    "ok": {
                      "const": true
                    },
                    "data": {
                      "$ref": "#/components/schemas/IdentityResponse"
                    }
                  }
                }
