name: CodeQL

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  plan:
    name: Plan scheduled analysis
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      should_scan: ${{ steps.changes.outputs.should_scan }}
    steps:
      - name: Check for new main commits
        id: changes
        env:
          API_URL: ${{ github.api_url }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          response=$(mktemp)
          trap 'rm -f -- "$response"' EXIT
          url="$API_URL/repos/$REPOSITORY/actions/workflows/codeql.yml/runs?branch=main&event=schedule&status=success&per_page=1"
          if ! curl --silent --show-error --fail-with-body --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$response" \
            "$url"; then
            echo "::warning::Could not inspect previous CodeQL runs; scanning fail-safe."
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_sha=$(jq -r '.workflow_runs[0].head_sha // ""' "$response")
          if [[ -n "$previous_sha" && "$previous_sha" == "$HEAD_SHA" ]]; then
            echo "No new main commit since the latest successful scheduled CodeQL run."
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: plan
    if: needs.plan.outputs.should_scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Autobuild compiled language
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
