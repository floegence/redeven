name: Release Redeven

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-ref:
    name: Validate release ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require the tag to target exact main
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE}" == "tag" ]]
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          tagged_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          if [[ "${tagged_commit}" != "${main_commit}" || "${tagged_commit}" != "${GITHUB_SHA}" ]]; then
            echo "release tag must target the exact origin/main commit" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: release-ref
    environment: redeven-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install cosign
        uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017

      - name: Import macOS runtime signing certificate
        if: matrix.goos == 'darwin'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.REDEVEN_DESKTOP_MAC_CERT_BASE64 }}
          p12-password: ${{ secrets.REDEVEN_DESKTOP_MAC_CERT_PASSWORD }}

      - name: Validate runtime compatibility contract
        run: ./scripts/check_runtime_compatibility_contract.sh "${GITHUB_REF_NAME}"

      - name: Build embedded assets
        run: ./scripts/build_assets.sh

      - name: Collect OKF bundle assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp okf/dist/okf_bundle.manifest.json dist/
          cp okf/dist/okf_bundle.sha256 dist/
          cp LICENSE dist/LICENSE
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::12}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          mkdir -p dist
          go build \
            -tags floeterm_native \
            -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}" \
            -o dist/redeven \
            ./cmd/redeven
          go build \
            -tags floeterm_native \
            -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}" \
            -o dist/redeven-gateway \
            ./cmd/redeven-gateway

      - name: Build signed ReDevPlugin runtime and package archives
        env:
          GH_TOKEN: ${{ github.token }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          REDEVEN_REDEVPLUGIN_RUNTIME_CODESIGN_IDENTITY: ${{ secrets.REDEVEN_DESKTOP_MAC_IDENTITY }}
        run: |
          set -euo pipefail

          redeven_entries=(
            redeven
            LICENSE
            THIRD_PARTY_NOTICES.md
          )
          ./scripts/stage_redevplugin_release_artifacts.sh \
            --dest-dir "dist/redevplugin-release" \
            --redeven-goos "$GOOS" \
            --redeven-goarch "$GOARCH" \
            --runtime-out "dist/redevplugin-runtime" \
            --profile release
          redeven_entries+=(
            redevplugin-runtime
            REDEVPLUGIN_THIRD_PARTY_NOTICES.md
            REDEVPLUGIN_RUNTIME.spdx.json
            redevplugin-runtime.provenance.json
            redevplugin-runtime.sig
            redevplugin-runtime.pem
            .redevplugin-release-artifacts-verified.json
          )
          (
            cd dist
            tar -czf "redeven_${GOOS}_${GOARCH}.tar.gz" "${redeven_entries[@]}"
          )
          tar -C dist -czf "dist/redeven-gateway_${GOOS}_${GOARCH}.tar.gz" redeven-gateway LICENSE THIRD_PARTY_NOTICES.md
          rm -f \
            dist/redeven \
            dist/redeven-gateway \
            dist/redevplugin-runtime \
            dist/REDEVPLUGIN_THIRD_PARTY_NOTICES.md \
            dist/REDEVPLUGIN_RUNTIME.spdx.json \
            dist/redevplugin-runtime.provenance.json \
            dist/redevplugin-runtime.sig \
            dist/redevplugin-runtime.pem \
            dist/.redevplugin-release-artifacts-verified.json

          upload_dir="dist/package-${GOOS}-${GOARCH}"
          mkdir -p "$upload_dir"
          cp "dist/redeven_${GOOS}_${GOARCH}.tar.gz" "$upload_dir/"
          cp "dist/redeven-gateway_${GOOS}_${GOARCH}.tar.gz" "$upload_dir/"
          cp dist/okf_bundle.manifest.json "$upload_dir/"
          cp dist/okf_bundle.sha256 "$upload_dir/"
          cp dist/LICENSE "$upload_dir/"
          cp dist/THIRD_PARTY_NOTICES.md "$upload_dir/"

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/package-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          include-hidden-files: true

  desktop:
    name: Desktop ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: build
    environment: redeven-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            builder_args: --linux
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            builder_args: --linux
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            builder_args: --mac dmg
          - goos: darwin
            goarch: arm64
            runner: macos-15
            builder_args: --mac dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Download matching runtime package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/agent
          gh run download "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist/agent \
            --name "package-${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Validate macOS signing inputs
        if: matrix.goos == 'darwin'
        env:
          REDEVEN_DESKTOP_MAC_CERT_BASE64: ${{ secrets.REDEVEN_DESKTOP_MAC_CERT_BASE64 }}
          REDEVEN_DESKTOP_MAC_CERT_PASSWORD: ${{ secrets.REDEVEN_DESKTOP_MAC_CERT_PASSWORD }}
          REDEVEN_DESKTOP_MAC_IDENTITY: ${{ secrets.REDEVEN_DESKTOP_MAC_IDENTITY }}
          REDEVEN_DESKTOP_MAC_NOTARY_API_KEY: ${{ secrets.REDEVEN_DESKTOP_MAC_NOTARY_API_KEY }}
          REDEVEN_DESKTOP_MAC_NOTARY_API_KEY_ID: ${{ secrets.REDEVEN_DESKTOP_MAC_NOTARY_API_KEY_ID }}
          REDEVEN_DESKTOP_MAC_NOTARY_API_ISSUER: ${{ secrets.REDEVEN_DESKTOP_MAC_NOTARY_API_ISSUER }}
          REDEVEN_DESKTOP_MAC_TEAM_ID: ${{ secrets.REDEVEN_DESKTOP_MAC_TEAM_ID }}
          REDEVEN_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.REDEVEN_SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            REDEVEN_DESKTOP_MAC_CERT_BASE64 \
            REDEVEN_DESKTOP_MAC_CERT_PASSWORD \
            REDEVEN_DESKTOP_MAC_IDENTITY \
            REDEVEN_DESKTOP_MAC_NOTARY_API_KEY \
            REDEVEN_DESKTOP_MAC_NOTARY_API_KEY_ID \
            REDEVEN_DESKTOP_MAC_NOTARY_API_ISSUER \
            REDEVEN_DESKTOP_MAC_TEAM_ID \
            REDEVEN_SPARKLE_PUBLIC_ED_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing required macOS release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare Apple notarization key
        if: matrix.goos == 'darwin'
        env:
          REDEVEN_DESKTOP_MAC_NOTARY_API_KEY: ${{ secrets.REDEVEN_DESKTOP_MAC_NOTARY_API_KEY }}
          REDEVEN_DESKTOP_MAC_NOTARY_API_KEY_ID: ${{ secrets.REDEVEN_DESKTOP_MAC_NOTARY_API_KEY_ID }}
        run: |
          set -euo pipefail
          key_dir="${RUNNER_TEMP}/redeven-notary"
          mkdir -p "${key_dir}"
          key_path="${key_dir}/AuthKey_${REDEVEN_DESKTOP_MAC_NOTARY_API_KEY_ID}.p8"
          printf '%s' "${REDEVEN_DESKTOP_MAC_NOTARY_API_KEY}" > "${key_path}"
          chmod 600 "${key_path}"
          printf 'REDEVEN_DESKTOP_MAC_NOTARY_KEY_PATH=%s\n' "${key_path}" >> "${GITHUB_ENV}"

      - name: Build desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.REDEVEN_DESKTOP_MAC_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.REDEVEN_DESKTOP_MAC_CERT_PASSWORD }}
          REDEVEN_DESKTOP_MAC_IDENTITY: ${{ secrets.REDEVEN_DESKTOP_MAC_IDENTITY }}
          REDEVEN_DESKTOP_MAC_TEAM_ID: ${{ secrets.REDEVEN_DESKTOP_MAC_TEAM_ID }}
          REDEVEN_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.REDEVEN_SPARKLE_PUBLIC_ED_KEY }}
          REDEVEN_DESKTOP_REQUIRE_UPDATE_CONFIG: "1"
          REDEVEN_DESKTOP_UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
          APPLE_API_KEY_ID: ${{ secrets.REDEVEN_DESKTOP_MAC_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.REDEVEN_DESKTOP_MAC_NOTARY_API_ISSUER }}
          REDEVEN_DESKTOP_BUNDLE_GOOS: ${{ matrix.goos }}
          REDEVEN_DESKTOP_BUNDLE_GOARCH: ${{ matrix.goarch }}
          REDEVEN_DESKTOP_RUNTIME_TARBALL: ${{ github.workspace }}/dist/agent/redeven_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          REDEVEN_DESKTOP_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd desktop
          version="${REDEVEN_DESKTOP_VERSION#v}"
          mac_identity="${REDEVEN_DESKTOP_MAC_IDENTITY:-}"
          apple_api_key="${REDEVEN_DESKTOP_MAC_NOTARY_KEY_PATH:-}"
          apple_api_key_id="${APPLE_API_KEY_ID:-}"
          apple_api_issuer="${APPLE_API_ISSUER:-}"
          if [ "${{ matrix.goos }}" != "darwin" ]; then
            mac_identity="-"
            apple_api_key=""
            apple_api_key_id=""
            apple_api_issuer=""
          fi
          REDEVEN_DESKTOP_VERSION="${version}" \
          REDEVEN_DESKTOP_MAC_IDENTITY="${mac_identity:--}" \
          APPLE_API_KEY="${apple_api_key}" \
          APPLE_API_KEY_ID="${apple_api_key_id}" \
          APPLE_API_ISSUER="${apple_api_issuer}" \
          npm run package -- ${{ matrix.builder_args }}

      - name: Install Linux installer inspection tools
        if: matrix.goos == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes cpio rpm rpm2cpio

      - name: Verify packaged ReDevPlugin runtime
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "${{ matrix.goos }}/${{ matrix.goarch }}" in
            linux/amd64)
              packages=(
                "desktop/release/Redeven-Desktop-${version}-linux-x64.deb"
                "desktop/release/Redeven-Desktop-${version}-linux-x64.rpm"
              )
              ;;
            linux/arm64)
              packages=(
                "desktop/release/Redeven-Desktop-${version}-linux-arm64.deb"
                "desktop/release/Redeven-Desktop-${version}-linux-arm64.rpm"
              )
              ;;
            darwin/amd64)
              packages=("desktop/release/Redeven-Desktop-${version}-mac-x64.dmg")
              ;;
            darwin/arm64)
              packages=("desktop/release/Redeven-Desktop-${version}-mac-arm64.dmg")
              ;;
            *)
              echo "unsupported Desktop release target" >&2
              exit 1
              ;;
          esac
          for package in "${packages[@]}"; do
            test -f "$package"
            ./scripts/check_desktop_redevplugin_package.sh \
              --package "$package" \
              --runtime-target "${{ matrix.goos }}/${{ matrix.goarch }}" \
              --write-receipt "${package}.redevplugin-verification.json"
          done

      - name: Verify macOS Sparkle package
        if: matrix.goos == 'darwin'
        env:
          REDEVEN_DESKTOP_MAC_TEAM_ID: ${{ secrets.REDEVEN_DESKTOP_MAC_TEAM_ID }}
          REDEVEN_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.REDEVEN_SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          arch="x64"
          if [[ "${{ matrix.goarch }}" == "arm64" ]]; then arch="arm64"; fi
          ./scripts/verify_macos_desktop_update_package.sh \
            --dmg "desktop/release/Redeven-Desktop-${version}-mac-${arch}.dmg" \
            --arch "$arch" \
            --expected-team-id "$REDEVEN_DESKTOP_MAC_TEAM_ID" \
            --sparkle-public-key "$REDEVEN_SPARKLE_PUBLIC_ED_KEY"

      - name: Upload desktop package artifact
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.dmg
            desktop/release/*.yml
            desktop/release/*.redevplugin-verification.json
          if-no-files-found: error

      - name: Remove temporary macOS signing material
        if: ${{ always() && matrix.goos == 'darwin' }}
        run: |
          set -euo pipefail
          rm -rf -- "${RUNNER_TEMP}/redeven-notary" desktop/.bundle/macos-updater desktop/native/macos-updater/.build/redeven-sparkle-headers

  sparkle:
    name: Generate signed macOS appcasts
    needs: desktop
    if: ${{ !contains(github.ref_name, '-') }}
    environment: redeven-release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Prepare Sparkle release tools
        run: ./scripts/prepare_desktop_macos_updater.sh

      - name: Download signed macOS packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/sparkle-input/x64 dist/sparkle-input/arm64
          gh run download "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name desktop-darwin-amd64 \
            --dir dist/sparkle-input/x64
          gh run download "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name desktop-darwin-arm64 \
            --dir dist/sparkle-input/arm64

      - name: Generate and verify signed appcasts
        env:
          REDEVEN_SPARKLE_PRIVATE_KEY: ${{ secrets.REDEVEN_SPARKLE_PRIVATE_KEY }}
          REDEVEN_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.REDEVEN_SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in REDEVEN_SPARKLE_PRIVATE_KEY REDEVEN_SPARKLE_PUBLIC_ED_KEY; do
            if [ -z "${!name:-}" ]; then missing+=("${name}"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing required Sparkle release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/desktop-sparkle
          x64_dmg="$(find dist/sparkle-input/x64 -type f -name 'Redeven-Desktop-*.dmg' -print -quit)"
          arm64_dmg="$(find dist/sparkle-input/arm64 -type f -name 'Redeven-Desktop-*.dmg' -print -quit)"
          [[ -n "$x64_dmg" && -n "$arm64_dmg" ]]
          ./scripts/generate_desktop_sparkle_appcast.sh \
            --dmg "$x64_dmg" \
            --arch x64 \
            --tag "${GITHUB_REF_NAME}" \
            --output-dir dist/desktop-sparkle
          ./scripts/generate_desktop_sparkle_appcast.sh \
            --dmg "$arm64_dmg" \
            --arch arm64 \
            --tag "${GITHUB_REF_NAME}" \
            --output-dir dist/desktop-sparkle
          test "$(find dist/desktop-sparkle -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 4

      - name: Upload signed Sparkle appcast artifact
        uses: actions/upload-artifact@v6
        with:
          name: desktop-sparkle
          path: dist/desktop-sparkle
          if-no-files-found: error

      - name: Remove temporary Sparkle material
        if: always()
        run: |
          set -euo pipefail
          rm -rf -- desktop/.bundle/macos-updater desktop/native/macos-updater/.build/redeven-sparkle-headers dist/sparkle-input

  release:
    name: Create GitHub Release
    needs:
      - build
      - desktop
      - sparkle
    if: ${{ always() && needs.build.result == 'success' && needs.desktop.result == 'success' && (needs.sparkle.result == 'success' || needs.sparkle.result == 'skipped') }}
    environment: redeven-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/downloads
          gh run download "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist/downloads \
            --pattern "package-*"

      - name: Download all desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/downloads
          gh run download "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist/downloads \
            --pattern "desktop-*"

      - name: Collect release assets
        run: |
          set -euo pipefail
          ./scripts/collect_release_artifacts.mjs \
            --downloads-dir dist/downloads \
            --dest-dir dist \
            --tag "${GITHUB_REF_NAME}"
          cp scripts/safe_extract_tar.py dist/safe_extract_tar.py

      - name: Install cosign
        uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017

      - name: Validate ReDevPlugin consumption gate
        run: ./scripts/check_redevplugin_consumption_gate.sh --scan-root dist --require-release

      - name: Generate and sign Runtime compatibility manifests
        run: |
          set -euo pipefail
          node --test scripts/generate_runtime_compatibility_manifests.test.mjs
          node scripts/generate_runtime_compatibility_manifests.mjs \
            --dist dist \
            --tag "${GITHUB_REF_NAME}"
          for manifest in dist/redeven-runtime-compatibility_*.json; do
            base="${manifest%.json}"
            cosign sign-blob --yes \
              --output-signature "${base}.sig" \
              --output-certificate "${base}.pem" \
              "$manifest"
          done

      - name: Generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          checksum_assets=(
            redeven_*.tar.gz
            redeven-gateway_*.tar.gz
            redeven-runtime-compatibility_*.json
            Redeven-Desktop-*.deb
            Redeven-Desktop-*.rpm
            Redeven-Desktop-*.dmg
            Redeven-Desktop-*.redevplugin-verification.json
            latest-linux*.yml
            safe_extract_tar.py
            LICENSE
            THIRD_PARTY_NOTICES.md
            okf_bundle.manifest.json
            okf_bundle.sha256
          )
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            checksum_assets+=(appcast-mac-*.xml Redeven-Desktop-*.md)
          fi
          sha256sum "${checksum_assets[@]}" > SHA256SUMS

      - name: Sign checksums with keyless OIDC
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - name: Generate release notes preface
        run: ./scripts/generate_release_notes.sh "${GITHUB_REF_NAME}" dist/RELEASE_NOTES.md

      - name: Validate release notes highlights
        run: |
          set -euo pipefail
          awk '
            /^## Release Highlights$/ { in_section = 1; next }
            /^## / && in_section { exit(found ? 0 : 1) }
            in_section && /^- / { found = 1 }
            END { exit(found ? 0 : 1) }
          ' dist/RELEASE_NOTES.md

      - name: Generate GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" > dist/GITHUB_RELEASE_NOTES.json

          jq -r '.name' dist/GITHUB_RELEASE_NOTES.json > dist/RELEASE_TITLE.txt
          jq -r '.body' dist/GITHUB_RELEASE_NOTES.json > dist/RELEASE_NOTES_AUTO.md

          {
            cat dist/RELEASE_NOTES.md
            printf '\n\n'
            cat dist/RELEASE_NOTES_AUTO.md
          } > dist/RELEASE_NOTES_FULL.md

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          title="$(cat dist/RELEASE_TITLE.txt)"
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release already exists for ${GITHUB_REF_NAME}; refusing to replace published assets" >&2
            exit 1
          fi

          assets=(
            dist/redeven_*.tar.gz
            dist/redeven-runtime-compatibility_*.json
            dist/redeven-runtime-compatibility_*.sig
            dist/redeven-runtime-compatibility_*.pem
            dist/redeven-gateway_*.tar.gz
            dist/Redeven-Desktop-*.deb
            dist/Redeven-Desktop-*.rpm
            dist/Redeven-Desktop-*.dmg
            dist/Redeven-Desktop-*.redevplugin-verification.json
            dist/latest-linux*.yml
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
            dist/safe_extract_tar.py
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
            dist/okf_bundle.manifest.json
            dist/okf_bundle.sha256
          )
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            assets+=(
              dist/appcast-mac-*.xml
              dist/Redeven-Desktop-*.md
            )
          fi
          for asset in "${assets[@]}"; do
            test -f "${asset}"
          done

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --title "${title}" \
            --notes-file dist/RELEASE_NOTES_FULL.md \
            "${release_flags[@]}"

          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            "${assets[@]}"

          local_manifest="$(mktemp)"
          remote_dir="$(mktemp -d)"
          for asset in "${assets[@]}"; do
            printf '%s  %s  %s\n' \
              "$(sha256sum "${asset}" | awk '{print $1}')" \
              "$(stat -c '%s' "${asset}")" \
              "$(basename "${asset}")"
          done | sort > "${local_manifest}"

          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${remote_dir}"
          remote_manifest="$(mktemp)"
          find "${remote_dir}" -mindepth 1 -maxdepth 1 -type f -print0 \
            | while IFS= read -r -d '' asset; do
                printf '%s  %s  %s\n' \
                  "$(sha256sum "${asset}" | awk '{print $1}')" \
                  "$(stat -c '%s' "${asset}")" \
                  "$(basename "${asset}")"
              done \
            | sort > "${remote_manifest}"
          cmp "${local_manifest}" "${remote_manifest}"

          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --title "${title}" \
            --notes-file dist/RELEASE_NOTES_FULL.md \
            "${release_flags[@]}"
