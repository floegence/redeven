<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .flower-background, .flower-core { display: none; }
    @media (max-width: 16px) {
      svg { --flower-icon-petal-stroke: 1.4; }
    }
