      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="65%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>
  </defs>
  <circle class="flower-background" cx="12" cy="12" r="11" fill="url(#bg)" />
  <g fill="#ffffff" stroke="#697788" stroke-width="var(--flower-icon-petal-stroke, 1.15)" stroke-linejoin="round">
    <path d="M 12 12 C 9.8 10, 7.2 7, 8.2 4.5 C 8.7 3, 10.3 1.8, 12 1.8 C 13.7 1.8, 15.3 3, 15.8 4.5 C 16.8 7, 14.2 10, 12 12 Z" transform="rotate(0 12 12)" />
