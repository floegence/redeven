      path { stroke: #64748b; stroke-width: 0.45; stroke-opacity: 0.18; stroke-linejoin: miter; opacity: 0.95; }
      path:nth-child(even) { stroke-opacity: 0.13; opacity: 0.85; }
      .flower-center { fill: url(#c); stroke: none; }
      .flower-background, .flower-core { display: inline; }
    }
  </style>
  <defs>
