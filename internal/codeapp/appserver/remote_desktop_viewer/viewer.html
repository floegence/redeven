<!doctype html>
<html data-redeven-window lang="{{.Locale}}" data-floe-shell-theme="{{.Theme}}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="{{.Base}}assets/floe.css"><link rel="stylesheet" href="{{.Base}}assets/viewer.css">
</head>
<body>
  <header id="toolbar" aria-label="" data-label="title">
    <div class="identity"><strong data-copy="title"></strong><span id="host"></span><span id="session-state" class="sr-only" role="status"></span></div>
    <div class="actions">
      <div class="action-group">
        <button id="display-settings" class="labeled" data-label="display" aria-haspopup="dialog"><span data-icon="display"></span><span data-copy="display"></span></button>
        <label class="mode-control"><span class="sr-only" data-copy="control"></span><select id="mode"><option value="view" data-copy="view"></option><option value="control" data-copy="control"></option></select></label>
      </div>
      <div class="action-group">
        <button id="clipboard" class="labeled" data-label="clipboard" aria-haspopup="dialog"><span data-icon="clipboard"></span><span data-copy="clipboard"></span></button>
        <button id="shortcuts" data-label="shortcuts" data-icon="shortcuts" aria-haspopup="dialog"></button>
        <button id="files" data-label="files" data-icon="files"></button>
      </div>
      <div class="action-group">
        <button id="settings" data-label="settings" data-icon="settings" aria-haspopup="dialog"></button>
        <button id="fullscreen" data-label="fullscreen" data-icon="fullscreen"></button>
        <button id="pin" data-label="pin" data-icon="pin" aria-pressed="false"></button>
      </div>
      <button id="disconnect" class="labeled danger" data-label="disconnect"><span data-icon="disconnect"></span><span data-copy="disconnect"></span></button>
    </div>
  </header>
  <div id="panel-storage" hidden><section id="display-options" class="settings-section">
    <label><span data-copy="display"></span><select id="display"></select></label>
    <div class="segmented" role="group" data-label="display">
      <button id="fit" class="labeled" data-label="fit" aria-pressed="true"><span data-icon="fit"></span><span data-copy="fit"></span></button>
      <button id="pixels" class="labeled" data-label="pixels" aria-pressed="false"><span data-icon="pixels"></span><span data-copy="pixels"></span></button>
    </div>
  </section></div>
  <main id="stage"><canvas id="desktop" tabindex="0" data-label="title" data-floe-remote-pointer></canvas></main>
  <section id="unlock-bar" hidden aria-live="polite"><strong data-copy="locked"></strong><p data-copy="unlockHint"></p><div><button id="start-unlock" data-copy="startUnlock"></button><button id="cancel-unlock" data-copy="cancel" hidden></button></div></section>
  <div id="connection" role="status"><div class="connection-symbol" data-icon="display" aria-hidden="true"></div><p id="status" data-copy="connecting"></p><p id="hint"></p><button id="reconnect" data-copy="reconnect" hidden></button><button id="retry-disconnect" data-copy="disconnect" hidden></button></div>
  <output id="notice" aria-live="polite"></output>
  <dialog id="panel" aria-labelledby="panel-title"><form method="dialog"><header><h2 id="panel-title"></h2><button class="icon-button" data-label="close" data-icon="close" value="close" autofocus></button></header></form><div id="panel-body"></div></dialog>
  <script nonce="{{.Nonce}}">window.remoteDesktopConfig={{.Configuration}};</script>
  <script src="{{.Base}}assets/catalog.generated.js"></script><script src="{{.Base}}assets/icons.generated.js"></script><script src="{{.Base}}assets/input.js"></script><script src="{{.Base}}assets/pointer.js"></script>
  <script src="{{.TransportScript}}"></script>
  <script type="module" src="{{.Base}}assets/viewer.js"></script>
</body></html>
