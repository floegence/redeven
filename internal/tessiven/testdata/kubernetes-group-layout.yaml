evidence:
  - id: ev-k8s-components
    source: inference
    locator: "https://kubernetes.io/docs/concepts/overview/components/"
    summary: "Kubernetes 官方 Components 文档：控制平面组件（kube-apiserver、etcd、kube-scheduler、kube-controller-manager）与节点组件（kubelet、kube-proxy、容器运行时）的组成与职责；节点组件在每个节点各运行一份。"
    observedAt: "2026-10-09T04:12:50-07:00"
  - id: ev-k8s-arch
    source: inference
    locator: "https://kubernetes.io/docs/concepts/architecture/"
    summary: "Kubernetes 官方 Cluster Architecture 文档：控制平面与节点之间的通信、控制器模型与节点注册/状态上报。"
    observedAt: "2026-10-09T04:12:50-07:00"
  - id: ev-k8s-ha
    source: inference
    locator: "https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/"
    summary: "Kubernetes 官方 kubeadm HA 文档：3 个及以上控制平面节点（奇数便于选主）与 3 个及以上工作节点；控制平面节点置于 kube-apiserver TCP 负载均衡（默认 6443）之后；etcd 提供 stacked（与控制平面同机）与 external（独立专用节点）两种拓扑，官方推荐 etcd 使用奇数成员。本图采用 external 拓扑、3 台 API 节点、3 台调度与控制器节点。"
    observedAt: "2026-10-09T04:12:50-07:00"
  - id: ev-lb-ha
    source: inference
    locator: "https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/"
    summary: "kubeadm HA 文档给出的控制平面前置负载均衡方案：使用 HAProxy 提供 TCP 转发并配合 keepalived 维护 VIP（也可用 kube-vip 等替代），负载均衡主机可为集群外的独立主机（主备两台实现 VIP 故障接管）。"
    observedAt: "2026-10-10T09:20:00-07:00"
  - id: ev-k8s-net
    source: inference
    locator: "https://kubernetes.io/docs/concepts/services-networking/"
    summary: "Kubernetes 官方 Services/Load Balancing/Networking 文档：Service、Ingress 与 Ingress Controller、DNS for Services and Pods（CoreDNS 服务发现）。"
    observedAt: "2026-10-09T04:12:50-07:00"
  - id: ev-k8s-storage
    source: inference
    locator: "https://kubernetes.io/docs/concepts/storage/"
    summary: "Kubernetes 官方 Storage 文档：Volumes、PersistentVolume/PersistentVolumeClaim、StorageClass 与 CSI 挂载模型。"
    observedAt: "2026-10-09T04:12:50-07:00"
  - id: ev-k8s-cri
    source: inference
    locator: "https://kubernetes.io/docs/concepts/containers/cri/"
    summary: "Kubernetes 官方 Container Runtime Interface 文档：kubelet 通过 CRI 调用容器运行时，运行时负责镜像拉取与容器运行。"
    observedAt: "2026-10-09T04:12:50-07:00"
  - id: ev-k8s-cni
    source: inference
    locator: "https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/"
    summary: "Kubernetes 官方 Network Plugins 文档：实现 Kubernetes 网络模型必须使用 CNI 插件；节点上的容器运行时负责加载 CNI 插件，因此每个节点都需要 CNI 配置与插件。"
    observedAt: "2026-10-09T04:12:50-07:00"
  - id: ev-k8s-addons
    source: inference
    locator: "https://kubernetes.io/docs/concepts/cluster-administration/addons/"
    summary: "Kubernetes 官方 Installing Addons 文档：CoreDNS、metrics-server 等集群插件的用途。"
    observedAt: "2026-10-09T04:12:50-07:00"
  - id: ev-conf-defaults
    source: configuration
    locator: "kubeadm 标准默认组件与端口约定（API Server 6443、etcd 2379/2380、CoreDNS 53、kubelet/kube-proxy 每节点一份）"
    summary: "标准 kubeadm 部署的默认组件清单与端口约定；本画布据此推断每节点一份的节点级组件与多副本插件形态，未在真实集群观测。"
    observedAt: "2026-10-09T04:12:50-07:00"
presentation:
  direction: DOWN
  initiallyExpanded: [g-access, g-lb, g-apiserver, g-etcd, g-controllers, g-addon-nodes, g-app-nodes]
  order: [g-access, res-domain, g-lb, res-ingress-lb, g-apiserver, g-etcd, g-controllers, g-addon-nodes, g-app-nodes, res-registry, res-storage]
  layers:
    - [g-access, res-domain]
    - [g-lb, res-ingress-lb]
    - [g-apiserver]
    - [g-etcd]
    - [g-controllers]
    - [g-addon-nodes]
    - [g-app-nodes]
    - [res-registry, res-storage]
  groupLayouts:
    g-etcd:
      flow: row
      maxPerLine: 3
