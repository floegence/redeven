# Unicode regression fixture derived from the Kubernetes canvas, revision 11.
apiVersion: redeven.io/tessiven/v1.1.0
kind: ServiceCanvas
metadata:
  title: "Kubernetes 架构图（K8s 集群参考架构）"
nodes:
  - id: n-client
    name: "客户端主机（kubectl / CI）"
    runtimeRef: "conceptual:k8s-ref-arch/client-01"
  - id: n-lb-1
    name: "控制平面负载均衡主机 1（keepalived MASTER）"
    runtimeRef: "conceptual:k8s-ref-arch/cp-lb-01"
  - id: n-lb-2
    name: "控制平面负载均衡主机 2（keepalived BACKUP）"
    runtimeRef: "conceptual:k8s-ref-arch/cp-lb-02"
  - id: n-api-1
    name: "API Server 节点 1"
    runtimeRef: "conceptual:k8s-ref-arch/api-01"
  - id: n-api-2
    name: "API Server 节点 2"
    runtimeRef: "conceptual:k8s-ref-arch/api-02"
  - id: n-api-3
    name: "API Server 节点 3"
    runtimeRef: "conceptual:k8s-ref-arch/api-03"
  - id: n-etcd-1
    name: "etcd 节点 1（池成员 1/3）"
    runtimeRef: "conceptual:k8s-ref-arch/etcd-01"
  - id: n-etcd-2
    name: "etcd 节点 2（池成员 2/3）"
    runtimeRef: "conceptual:k8s-ref-arch/etcd-02"
  - id: n-etcd-3
    name: "etcd 节点 3（池成员 3/3）"
    runtimeRef: "conceptual:k8s-ref-arch/etcd-03"
  - id: n-ctrl-1
    name: "调度与控制器节点 1"
    runtimeRef: "conceptual:k8s-ref-arch/ctrl-01"
  - id: n-ctrl-2
    name: "调度与控制器节点 2"
    runtimeRef: "conceptual:k8s-ref-arch/ctrl-02"
  - id: n-ctrl-3
    name: "调度与控制器节点 3"
    runtimeRef: "conceptual:k8s-ref-arch/ctrl-03"
  - id: n-addon-1
    name: "集群插件节点 1"
    runtimeRef: "conceptual:k8s-ref-arch/addon-01"
  - id: n-addon-2
    name: "集群插件节点 2"
    runtimeRef: "conceptual:k8s-ref-arch/addon-02"
  - id: n-addon-3
    name: "集群插件节点 3"
    runtimeRef: "conceptual:k8s-ref-arch/addon-03"
  - id: n-app-1
    name: "业务负载节点 1"
    runtimeRef: "conceptual:k8s-ref-arch/app-01"
  - id: n-app-2
    name: "业务负载节点 2"
    runtimeRef: "conceptual:k8s-ref-arch/app-02"
  - id: n-app-3
    name: "业务负载节点 3"
    runtimeRef: "conceptual:k8s-ref-arch/app-03"
groups:
  - id: g-access
    name: "客户端接入层（kubectl / CI → 控制平面 VIP）"
    nodeRefs: [n-client]
  - id: g-lb
    name: "控制平面负载均衡层（keepalived + HAProxy，主备 VIP:6443）"
    nodeRefs: [n-lb-1, n-lb-2]
  - id: g-apiserver
    name: "API Server 层（3 节点 HA：kube-apiserver + 节点基础组件）"
    nodeRefs: [n-api-1, n-api-2, n-api-3]
  - id: g-etcd
    name: "etcd 节点池（external 拓扑：3 台专用节点，奇数成员仲裁）"
    nodeRefs: [n-etcd-1, n-etcd-2, n-etcd-3]
  - id: g-controllers
    name: "调度与控制器层（3 节点：kube-scheduler + kube-controller-manager + 节点基础组件）"
    nodeRefs: [n-ctrl-1, n-ctrl-2, n-ctrl-3]
  - id: g-addon-nodes
    name: "集群插件节点层（CoreDNS / Ingress Controller / metrics-server）"
    nodeRefs: [n-addon-1, n-addon-2, n-addon-3]
  - id: g-app-nodes
    name: "业务负载节点层（应用副本 + Service）"
    nodeRefs: [n-app-1, n-app-2, n-app-3]
services:
  - id: svc-kubectl
    name: "kubectl / CI 客户端"
    kind: api
    description: "管理员与 CI 通过 kubeconfig 访问集群的客户端入口，指向控制平面 VIP（6443）。"
  - id: svc-cp-lb
    name: "控制平面负载均衡（keepalived + HAProxy）"
    kind: gateway
    description: "为主备 VIP 提供到各 API Server 的 TCP（6443）转发与健康检查；2 台主机主备运行，VIP 漂移接管。"
  - id: svc-apiserver
    name: "kube-apiserver"
    kind: api
    description: "集群唯一的前端 REST API 与状态读写入口，3 个实例同时服务（默认 6443）。"
  - id: svc-scheduler
    name: "kube-scheduler"
    kind: scheduler
    description: "为未绑定 Pod 选择节点；多副本通过选主，仅一个实例激活。"
  - id: svc-controller-manager
    name: "kube-controller-manager"
    kind: controller
    description: "运行 Deployment、ReplicaSet、Node 等控制器循环，把实际状态收敛到期望状态；多副本通过选主。"
  - id: svc-etcd
    name: "etcd（集群状态存储）"
    kind: coordination
    description: "保存全部集群状态的一致键值存储，以 Raft 多成员组成仲裁集群；external 拓扑，3 台成员同属 etcd 节点池（分组 g-etcd），默认端口 2379/2380。"
  - id: svc-node-base
    name: "节点基础组件（kubelet / 容器运行时 / kube-proxy / CNI）"
    kind: node_agent
    description: "每个 Kubernetes 节点各运行一份的节点级组件：kubelet 节点代理、容器运行时（containerd / CRI-O）、kube-proxy 服务网络代理、CNI 网络插件。本图把它们合并为一行展示以降低单机卡片密度，实例仍逐节点逐一存在。"
  - id: svc-coredns
    name: "CoreDNS（集群 DNS）"
    kind: dns
    description: "为 Service 与 Pod 提供集群内名字解析与服务发现；2 副本分布在插件节点上。"
  - id: svc-ingress
    name: "Ingress Controller（如 ingress-nginx）"
    kind: ingress
    description: "读取 Ingress 资源并按 Host/Path 把外部请求路由到集群内 Service；3 副本同时服务。"
  - id: svc-metrics-server
    name: "metrics-server"
    kind: metrics
    description: "采集节点与 Pod 资源指标，为 HPA 与 kubectl top 提供数据；通常单副本运行。"
  - id: svc-app
    name: "业务工作负载（Deployment / Pod）"
    kind: workload
    description: "容器化应用副本，通过 Service 暴露；由控制器调度到业务负载节点。"
