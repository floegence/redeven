resources:
  - id: res-ingress-lb
    name: "入口负载均衡（Service type=LoadBalancer / MetalLB 或云 LB）"
    kind: load_balancer
    description: "四层负载均衡，把外部流量转发到 Ingress Controller 副本。"
  - id: res-domain
    name: "外部 DNS 域名（Ingress Host）"
    kind: domain
    description: "对外暴露的域名，解析到入口负载均衡地址。"
  - id: res-registry
    name: "容器镜像仓库（Registry）"
    kind: external
    description: "提供容器镜像的拉取来源，可位于集群外或集群内。"
  - id: res-storage
    name: "持久化存储后端（PV / StorageClass / CSI）"
    kind: nas
    description: "由 StorageClass 动态或静态供给的持久卷后端存储。"
